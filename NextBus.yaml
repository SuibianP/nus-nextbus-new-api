openapi: "3.0.0"
info:
  title: NUS NextBus
  description: "***Unofficially reverse-engineered API*** used by NUS NextBus application."
  termsOfService: http://nus.edu.sg/registrar/docs/info/registration-guides/aup-form.pdf
  version: 2.0.0
  contact:
    name: Hu Jialun
    url: https://github.com/SuibianP
    email: hujialun@outlook.sg
  license:
    name: DISCLAIMER
    url: https://github.com/SuibianP/nus-nextbus-new-api/blob/openapi-def/DISCLAIMER.md
servers:
  - url: https://fms.connectx.com.sg/apiy/NUSETA
    description: Current server used by uNivUS app
  - url: https://nnextbus.nus.edu.sg
    description: Current server used by NUS NextBus app (possibly phasing out)
  - url: https://nextbus.comfortdelgro.com.sg/eventservice.svc
    description: OBSOLETE DEPRECATED server preserved merely for historical significance

paths:
  /univus-public/mobile/get-access-token:
    post:
      tags:
        - univus
      servers:
        - url: https://myizaac2.nus.edu.sg
          description: uNivUS authentication server
      summary: Get public access token
      description: Authenticate as PUBLIC domain user and get JWT access token valid for 24 hours. No login required.
      operationId: GetPublicAccessToken
      security: []
      parameters:
        - in: header
          name: X-HTD-API
          required: true
          schema:
            type: string
          description: HTD API key
        - in: header
          name: X-APP-API
          required: true
          schema:
            type: string
          description: App API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - deviceid
                - ipaddr
                - version
              properties:
                deviceid:
                  type: string
                  format: uuid
                  description: Device UUID
                ipaddr:
                  type: string
                  format: ipv4
                  description: IP address
                  example: 0.0.0.0
                version:
                  type: string
                  description: App version
                  example: 2.56.0
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                  code:
                    type: string
                    pattern: '^\d{5}$'
                  data:
                    type: object
                    properties:
                      username:
                        type: string
                        example: User
                      token:
                        type: string
                        description: JWT access token (RS256, valid 24h)
                        example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
                      userid:
                        type: string
                        format: uuid
                      domain:
                        $ref: '#/components/schemas/Domain'
                  ts:
                    type: string
                    pattern: '^\d{14}$'
                    description: Timestamp (YYYYMMDDHHmmss)
                    example: "20260517201045"
        400:
          description: Bad Request
        500:
          description: Internal Server Error
  /univus/mobile/buswidget/get-init-data:
    post:
      tags:
        - univus
      servers:
        - url: https://myizaac2.nus.edu.sg
          description: uNivUS authentication server
      summary: Get bus widget initialization data
      description: Get FMS tokens (nextbus_token2), LTA DataMall token, route colors, and stop mappings. Requires access token from get-access-token endpoint.
      operationId: GetBusWidgetInitData
      # security:
      #   - BusWidget: []
      parameters:
        - in: header
          name: X-HTD-API
          required: true
          schema:
            type: string
          description: HTD API key
        - in: header
          name: X-APP-API
          required: true
          schema:
            type: string
          description: App API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - deviceid
                - domain
                - ipaddr
                - token
                - userid
                - version
              properties:
                deviceid:
                  type: string
                  format: uuid
                  description: Same device UUID from get-access-token
                domain:
                  $ref: '#/components/schemas/Domain'
                ipaddr:
                  type: string
                  format: ipv4
                  example: 0.0.0.0
                token:
                  type: string
                  description: Access token from get-access-token
                userid:
                  type: string
                  format: uuid
                  description: User ID from access token response
                version:
                  type: string
                  example: 2.56.0
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                  code:
                    type: string
                    pattern: '^\d{5}$'
                  data:
                    type: object
                    properties:
                      tokens:
                        type: object
                        properties:
                          datamall_token:
                            type: string
                            description: LTA DataMall API key
                          nextbus_token:
                            type: string
                            description: DEPRECATED - Use nextbus_token2 instead (returns error 4)
                          nextbus_token2:
                            type: string
                            description: FMS API token (use this for ConnectX FMS endpoints)
                      bus_stops:
                        type: array
                        description: Bus stop ID to LTA stop code mapping
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Internal shuttle stop ID
                              example: KR-MRT
                            number:
                              type: string
                              description: LTA public bus stop code
                              example: "18331"
                      bus-stop-color:
                        type: array
                        description: Route color configuration for UI
                        items:
                          type: object
                          properties:
                            BUS:
                              type: string
                              description: Route code
                              example: A1
                            COLOR_CODE:
                              type: string
                              pattern: '^[0-9A-F]{6}$'
                              description: Background color (hex)
                              example: FB0101
                            COLOR_FONT:
                              type: string
                              pattern: '^[0-9A-F]{6}$'
                              description: Font color (hex)
                              example: FFFFFF
                  ts:
                    type: string
                    pattern: '^\d{14}$'
        401:
          description: Unauthorized - Invalid or expired access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: Fail to verify access token
                  code:
                    type: string
                    example: "10000"
        400:
          description: Bad Request
  /BusStops:
    get:
      tags:
        - bus
      summary: Get list of bus stops
      description: Get information about bus stops
      operationId: GetListOfBusStops
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  BusStopsResult:
                    type: object
                    properties:
                      busstops:
                        type: array
                        items:
                          type: object
                          properties:
                            LongName:
                              type: string
                            ShortName:
                              type: string
                            caption:
                              type: string
                            latitude:
                              type: number
                              format: double
                            longitude:
                              type: number
                              format: double
                            name:
                              type: string
        401:
          $ref: '#/components/responses/401'
  /PickupPoint:
    get:
      tags:
        - bus
      summary: Get pickup point
      description: Get all pickup points of a specified route
      operationId: GetPickupPoint
      parameters:
        - $ref: '#/components/parameters/route_code'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  PickupPointResult:
                    type: object
                    properties:
                      pickuppoint:
                        type: array
                        items:
                          type: object
                          properties:
                            LongName:
                              type: string
                            ShortName:
                              type: string
                            busstopcode:
                              type: string
                            lat:
                              type: number
                              format: double
                            lng:
                              type: number
                              format: double
                            pickupname:
                              type: string
                            routeid:
                              type: integer
                            seq:
                              type: integer
        404:
          $ref: '#/components/responses/404-service'
        401:
          $ref: '#/components/responses/401'
  /ShuttleService:
    get:
      tags:
        - bus
      summary: Get shuttle service
      description: Get all oncoming shuttle bus services at a specified stop
      operationId: GetShuttleService
      parameters:
        - $ref: '#/components/parameters/busstopname'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ShuttleServiceResult:
                    type: object
                    properties:
                      Timestamp:
                        type: string
                        format: date-time
                      caption:
                          type: string
                      hints:
                        type: array
                        items:
                          type: string
                      name:
                        type: string
                      shuttles:
                        type: array
                        items:
                          type: object
                          properties:
                            _etas:
                              type: array
                              items:
                                type: object
                                properties:
                                  eta:
                                    type: integer
                                  eta_s:
                                    type: integer
                                  jobid:
                                    type: integer
                                  plate:
                                    type: string
                                  px:
                                    type: string
                                  ts:
                                    type: string
                                    format: date-time
                            arrivalTime:
                              type: string
                              pattern: '^-?\d*$'
                            arrivalTime_veh_plate:
                              type: string
                            busstopcode:
                              type: string
                            name:
                              type: string
                            nextArrivalTime:
                              type: string
                              pattern: '^-?\d*$'
                            nextArrivalTime_veh_plate:
                              type: string
                            nextPassengers:
                              type: string
                            passengers:
                              type: string
                            routeid:
                              type: integer
        404:
          $ref: '#/components/responses/404-busstop'

        401:
          $ref: '#/components/responses/401'
  /ActiveBus:
    get:
      tags:
        - bus
      summary: Get active bus
      description: Get all active bus of a specified route
      operationId: GetActiveBus
      parameters:
        - $ref: '#/components/parameters/route_code'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ActiveBusResult:
                    type: object
                    properties:
                      ActiveBusCount:
                          type: string
                          pattern: '^\d*$'
                      Timestamp:
                        type: string
                        format: date-time
                      activebus:
                        type: array
                        items:
                          type: object
                          properties:
                            direction:
                              type: integer
                            lat:
                              type: number
                              format: float
                            lng:
                              type: number
                              format: float
                            loadInfo:
                              type: object
                              properties:
                                capacity:
                                  type: integer
                                crowdLevel:
                                  type: string
                                  enum:
                                    - low
                                    - medium
                                    - high
                                occupancy:
                                  type: number
                                  format: double
                                ridership:
                                  type: integer
                            speed:
                              type: integer
                            vehplate:
                              type: string
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404-service'
  /RouteMinMaxTime:
    get:
      tags:
        - bus
      summary: Get route min max time
      description: Get the minimum and maximum operating time of a route
      operationId: GetRouteMinMaxTime
      parameters:
        - $ref: '#/components/parameters/route_code'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  RouteMinMaxTimeResult:
                    type: object
                    properties:
                      RouteMinMaxTime:
                        type: array
                        items:
                          type: object
                          properties:
                            Dates:
                              type: string
                            DayName:
                              type: string
                            DayType:
                              type: string
                              enum:
                                - Mon-Fri
                                - Sat
                                - Sun
                                - PH
                                - Special Day
                            DisplayOrder:
                              type: string
                              pattern: '^\d+$'
                            FirstTime:
                              type: string
                              pattern: '^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$'
                            LastTime:
                              type: string
                              pattern: '^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$'
                            Route:
                              type: string
                            ScheduleType:
                              type: string
                              enum:
                                - Term
                                - Vacation
        404:
          $ref: '#/components/responses/404-service'
        401:
          $ref: '#/components/responses/401'
  /ServiceDescription:
    get:
      tags:
        - bus
      summary: Get service description
      description: Get brief path for each route
      operationId: GetServiceDescription
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ServiceDescriptionResult:
                    type: object
                    properties:
                      ServiceDescription:
                        type: array
                        items:
                          type: object
                          properties:
                            Route:
                              type: string
                            RouteDescription:
                              type: string
                            RouteLongName:
                              type: string
        401:
          $ref: '#/components/responses/401'
  /Announcements:
    get:
      tags:
        - bus
      summary: Get announcements
      description: Get all announcements
      operationId: GetAnnouncements
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  AnnouncementsResult:
                    type: object
                    properties:
                      Announcement:
                        type: array
                        items:
                          type: object
                          properties:
                            Affected_Service_Ids:
                              type: string
                            Created_By:
                              type: string
                            Created_On:
                              type: string
                              format: date-time
                            ID:
                              type: string
                              pattern: '^\d+$'
                            Priority:
                              type: string
                              pattern: '^\d+$'
                            Status:
                              type: string
                              enum:
                                - Enabled
                                - Disabled
                            Text:
                              type: string
                              format: html
                      TimeStamp:
                        type: string
                        format: date-time
        401:
          $ref: '#/components/responses/401'
  /TickerTapes:
    get:
      tags:
        - bus
      summary: Get ticker tapes
      description: Get all ticker tapes
      operationId: GetTickerTapes
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  TickerTapesResult:
                    type: object
                    properties:
                      TickerTape:
                        type: array
                        items:
                          type: object
                          properties:
                            Accident_Latitude:
                              type: number
                              format: double
                            Accident_Longitude:
                              type: number
                              format: double
                            Affected_Service_Ids:
                              type: string
                            Created_By:
                              type: string
                            Created_On:
                              type: string
                              format: date-time
                            Display_From:
                              type: string
                              format: date-time
                            Display_To:
                              type: string
                              format: date-time
                            ID:
                              type: string
                              pattern: '^\d+$'
                            Message:
                              type: string
                            Priority:
                              type: string
                              enum:
                                - High
                                - Medium
                                - Low
                            Status:
                              type: string
                              enum:
                                - Enabled
                                - Disabled
                      TimeStamp:
                        type: string
                        format: date-time
  /CheckPoint:
    get:
      tags:
        - bus
      summary: Get checkpoints
      description: Get all checkpoints of a specified route
      operationId: GetAllCheckpoints
      parameters:
        - $ref: '#/components/parameters/route_code'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  CheckPointResult:
                    type: object
                    properties:
                      CheckPoint:
                        type: array
                        items:
                          type: object
                          properties:
                            PointID:
                              type: string
                              pattern: '\d+'
                            latitude:
                              type: number
                              format: double
                            longitude:
                              type: number
                              format: double
                            routeid:
                              type: integer

components:
  responses:
    401:
      description: Unauthorized
      content:
        text/html:
          schema:
            type: string
            enum: [Unauthorized Access]
    404-service:
        description: Not Found
        content:
          text/html:
            schema:
              type: string
              enum: [Service not found!]
    404-busstop:
      description: Not Found
      content:
        text/html:
          schema:
            type: string
            enum: [Bus stop not found!]
  parameters:
    route_code:
      in: query
      name: route_code
      schema:
        type: string
        description: Code of the bus route
    busstopname:
      in: query
      name: busstopname
      schema:
        type: string
        description: Name of the bus stop
  schemas:
    Domain:
      type: string
      enum:
        - PUBLIC
        - NUSSTU
        - NUSSTF
        - NUSEXT
        - ALUMNI
        - NUSU
        - APPLICANT
      example: PUBLIC
      description: User domain/tenant
  securitySchemes:
    NextBus:
      type: http
      scheme: basic
    uNivUS:
      type: apiKey
      name: token
      in: query
      description: FMS access token (nextbus_token2) obtained from uNivUS buswidget endpoint
    # BusWidget:
    #   type: http
    #   scheme: bearer
    #   bearerFormat: JWT
    #   description: JWT access token from get-access-token endpoint (NOT REQUIRED - token in body is used instead)

security:
  - NextBus: []
  - uNivUS: []
